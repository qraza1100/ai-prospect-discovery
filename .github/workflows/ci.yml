name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: python -m pytest --cov=app --cov-report=term
      - run: pip-audit -r requirements.txt
